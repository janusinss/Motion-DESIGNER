<!doctype html>
<!-- CI smoke fixture: 2 s, no network, seek-safe via window.__seek (motionmaxxing render.mjs contract).
     Warm palette and motion through the last frame so motion-critic has real evidence to measure. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #14110f; }
  .bar { position: absolute; left: 0; height: 36px; border-radius: 18px; }
  #word { position: absolute; top: 150px; width: 640px; text-align: center; font: 700 56px/1 sans-serif; color: #f4ead8; }
</style>
</head>
<body data-composition-id="main" data-width="640" data-height="360" data-duration="2">
<div id="word">SMOKE</div>
<script>
  const COLORS = ['#e4572e', '#f3a712', '#e8d33f', '#d1495b', '#ff8c42', '#c3423f'];
  const bars = COLORS.map((c, i) => {
    const d = document.createElement('div');
    d.className = 'bar'; d.style.background = c; d.style.top = (20 + i * 54) + 'px';
    document.body.appendChild(d); return d;
  });
  const word = document.getElementById('word');
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  window.__duration = 2;
  window.__seek = (t) => {
    // energy rises toward ~1.3 s (hero window) and keeps moving to the end
    const k = 0.35 + 0.65 * Math.exp(-Math.pow((t - 1.3) / 0.35, 2));
    bars.forEach((b, i) => {
      const w = 80 + 480 * ease(t / 0.6 - i * 0.08);
      b.style.width = w + 'px';
      b.style.transform = `translateX(${Math.sin(t * 9 * k + i) * 40 * k}px)`;
    });
    word.style.transform = `translateY(${Math.sin(t * 6) * 14}px) scale(${1 + 0.25 * k})`;
    word.style.letterSpacing = (4 + 18 * k) + 'px';
  };
  window.__seek(0);
</script>
</body>
</html>
